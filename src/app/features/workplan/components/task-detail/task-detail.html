<div class="task-detail" *ngIf="task">
  <div class="task-detail__nav">
    <button class="btn btn--ghost" (click)="onBack()">← Back to Board</button>
  </div>

  <div class="task-detail__card">
    <h2>Edit Task</h2>

    <div class="form-group">
      <label>Title</label>
      <input [(ngModel)]="task.title" class="form-control" />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea [(ngModel)]="task.description" class="form-control" rows="3"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Priority</label>
        <select [(ngModel)]="task.priority" class="form-control">
          <option *ngFor="let p of priorities" [value]="p">{{ p }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select [(ngModel)]="task.status" class="form-control">
          <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Assignee</label>
        <input [(ngModel)]="task.assignee" class="form-control" />
      </div>

      <div class="form-group">
        <label>Due Date</label>
        <input type="date" [(ngModel)]="task.dueDate" class="form-control" />
      </div>
    </div>

    <div class="task-detail__actions">
      <button class="btn btn--ghost" (click)="onBack()">Cancel</button>
      <button class="btn btn--primary" (click)="onSave()">Save Changes</button>
    </div>
  </div>
</div>
