<div class="task-list">
  <div class="task-list__header">
    <h2>{{ title }}</h2>
    <span class="task-list__count">{{ tasks.length }}</span>
  </div>

  <div class="task-list__body">
    <app-task-card
      *ngFor="let task of tasks; trackBy: trackById"
      [task]="task"
      (statusChanged)="statusChanged.emit($event)"
      (taskDeleted)="taskDeleted.emit($event)"
    />

    <p *ngIf="tasks.length === 0" class="task-list__empty">No tasks here.</p>
  </div>
</div>
