<div class="workplan-board">
  <header class="workplan-board__header">
    <h1>Workplan Board</h1>
  </header>

  <p *ngIf="loading" class="state-msg">Loading tasks...</p>
  <p *ngIf="error" class="state-msg state-msg--error">{{ error }}</p>

  <div class="workplan-board__columns" *ngIf="!loading && !error">
    <app-task-list
      title="To Do"
      [tasks]="getTasksByStatus(TaskStatus.Todo)"
      (statusChanged)="onStatusChanged($event)"
      (taskDeleted)="onTaskDeleted($event)"
    />

    <app-task-list
      title="In Progress"
      [tasks]="getTasksByStatus(TaskStatus.InProgress)"
      (statusChanged)="onStatusChanged($event)"
      (taskDeleted)="onTaskDeleted($event)"
    />

    <app-task-list
      title="Done"
      [tasks]="getTasksByStatus(TaskStatus.Done)"
      (statusChanged)="onStatusChanged($event)"
      (taskDeleted)="onTaskDeleted($event)"
    />

    <app-task-list
      title="Cancelled"
      [tasks]="getTasksByStatus(TaskStatus.Cancelled)"
      (statusChanged)="onStatusChanged($event)"
      (taskDeleted)="onTaskDeleted($event)"
    />
  </div>
</div>
